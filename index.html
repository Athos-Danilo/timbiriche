<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Timbiriche</title>
    <link rel="stylesheet" href="index.css">
</head>
<body>
    <h1>Timbiriche</h1>
    <p id="explicacao">Ligue os pontos vizinhos. Quem fechar o quadrado marca um ponto e joga novamente.</p>

    <p id="mensagem">Escolha o modo e o tamanho, depois clique em "Novo Jogo".</p>
    
    <div id="controles">
        <div class="campo">
            <label for="modo">Modo de Jogo</label>
            <select id="modo">
                <option value="robo">1 Pessoa vs Robô</option>
                <option value="dois">2 Pessoas</option>
            </select>
        </div>

        <div class="campo">
            <label for="tamanho">Tamanho do Tabuleiro</label>
            <select id="tamanho">
                <option value="4">4 x 4</option>
                <option value="8">8 x 8</option>
                <option value="16">32 x 32</option>
                <option value="32">32 x 32</option>
            </select>
        </div>

        <button id="botaoNovoJogo">Novo Jogo</button>
    </div>

    <div id="placar">
        <div class="caixa-placar" id="caixaUm">
            <span id="placarJogador">Jogador 1: 0</span>
        </div>

        <div class="caixa-placar" id="caixaDois">
            <span id="placarRobo">Jogador 2: 0</span>
        </div>
    </div>

    <div id="tabuleiro"></div>

    <script src="index.js"></script>
</body>
</html>
